version: "3.9"

services:

  # ======================
  # BUSINESS DATABASE
  # ======================
  postgres_app:
    image: postgres:16
    container_name: course_work_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: course_work
      POSTGRES_USER: course_user
      POSTGRES_PASSWORD: course_pass
    volumes:
      - pgdata_app:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_user -d course_work"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # ======================
  # KEYCLOAK DATABASE
  # ======================
  postgres_keycloak:
    image: postgres:16
    container_name: keycloak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      - pgdata_keycloak:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak_user -d keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth-net

  # ======================
  # SPRING BACKEND
  # ======================
  app:
    build: .
    container_name: course_work_app
    restart: unless-stopped
    depends_on:
      postgres_app:
        condition: service_healthy
    ports:
      - "8079:8079"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_app:5432/course_work
      SPRING_DATASOURCE_USERNAME: course_user
      SPRING_DATASOURCE_PASSWORD: course_pass

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://host.docker.internal:8080/realms/refactoring

      JWT_ACCESS_PRIVATE: 
      JWT_ACCESS_PUBLIC: 
      JWT_ACCESS_LIFETIME: 3600
      JWT_REFRESH_PRIVATE: 
      JWT_REFRESH_PUBLIC: 
      JWT_REFRESH_LIFETIME: 360000
    networks:
      - backend-net
      - auth-net

  # ======================
  # KEYCLOAK
  # ======================
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    depends_on:
      postgres_keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_pass

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak-themes:/opt/keycloak/themes
    networks:
      - auth-net

  # ======================
  # OBSERVABILITY
  # ======================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - backend-net

# ======================
# VOLUMES
# ======================
volumes:
  pgdata_app:
  pgdata_keycloak:

# ======================
# NETWORKS
# ======================
networks:
  backend-net:
    driver: bridge
  auth-net:
    driver: bridge
